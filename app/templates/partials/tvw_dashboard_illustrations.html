{# Reusable inline SVG illustrations for the community dashboard action cards #}

{% macro mix_bench_illustration() -%}
<svg class="tvw-illus tvw-illus--mix" viewBox="0 0 320 240" role="img" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="tvwMixSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f48"/>
      <stop offset="100%" stop-color="#252830"/>
    </linearGradient>
    <pattern id="tvwMixGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="304" height="224" rx="14" fill="url(#tvwMixSurface)" stroke="#4a4030" stroke-opacity="0.45"/>
  <rect x="8" y="8" width="304" height="224" rx="14" fill="url(#tvwMixGrid)"/>
  <!-- rear bottles -->
  <rect x="44" y="72" width="28" height="78" rx="6" fill="#2d3340" stroke="#ff9800" stroke-opacity="0.35"/>
  <rect x="82" y="62" width="28" height="88" rx="6" fill="#2d3340" stroke="#29b6f6" stroke-opacity="0.35"/>
  <rect x="120" y="78" width="28" height="72" rx="6" fill="#2d3340" stroke="#ff9800" stroke-opacity="0.25"/>
  <rect x="52" y="66" width="12" height="10" rx="3" fill="#1a1d24"/>
  <rect x="90" y="56" width="12" height="10" rx="3" fill="#1a1d24"/>
  <rect x="128" y="72" width="12" height="10" rx="3" fill="#1a1d24"/>
  <!-- scale base -->
  <rect x="168" y="168" width="132" height="28" rx="8" fill="#141820" stroke="#555b66"/>
  <rect x="176" y="174" width="116" height="16" rx="4" fill="#0a0c10"/>
  <!-- scale platform -->
  <rect x="198" y="148" width="72" height="22" rx="4" fill="#303640" stroke="#ff9800" stroke-opacity="0.55"/>
  <!-- bottle on scale -->
  <rect x="222" y="88" width="24" height="62" rx="7" fill="#3d4654" stroke="#e8eaed" stroke-opacity="0.55"/>
  <rect x="226" y="82" width="16" height="10" rx="3" fill="#555d6a"/>
  <rect x="228" y="104" width="12" height="28" rx="2" fill="#ff9800" fill-opacity="0.45"/>
  <!-- lcd -->
  <rect x="188" y="178" width="92" height="14" rx="3" fill="#102018" stroke="#29b6f6" stroke-opacity="0.35"/>
  <text x="234" y="189" text-anchor="middle" fill="#7dd3fc" font-size="9" font-family="Consolas, monospace" font-weight="700">12.45 g</text>
  <!-- accent glow -->
  <circle cx="234" cy="118" r="34" fill="#ff9800" fill-opacity="0.06"/>
</svg>
{%- endmacro %}
