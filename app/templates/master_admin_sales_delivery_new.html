{% extends "base.html" %}
{% block title %}New Delivery - Sales Control{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
  <div><h1 class="h3 mb-1">Create Delivery</h1><div class="text-secondary small">Consignment drop or direct sale dispatch.</div></div>
  <a class="btn btn-outline-light btn-sm" href="{{ url_for('master_admin.sales_dashboard') }}">Back to Sales Dashboard</a>
</div>

<form method="POST" class="card border-0" style="background:#151515; border:1px solid #333 !important;">
  <div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-4">
        <label class="form-label small text-secondary">Client</label>
        <select name="client_id" class="form-select bg-black border-secondary" required>
          <option value="">Select client...</option>
          {% for c in clients %}<option value="{{ c.id }}">{{ c.name }} ({{ c.client_type }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small text-secondary">Delivery Type</label>
        <select name="delivery_type" class="form-select bg-black border-secondary">
          <option value="consignment" selected>Consignment</option>
          <option value="direct_sale">Direct Sale</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label small text-secondary">Delivery Date</label>
        <input type="date" name="delivery_date" class="form-control bg-black border-secondary" value="">
      </div>
      <div class="col-12 col-md-4">
        <label class="form-label small text-secondary">Notes</label>
        <input name="notes" class="form-control bg-black border-secondary" placeholder="optional">
      </div>
    </div>

    <h2 class="h5 mb-2">Line Items</h2>
    <input type="hidden" name="row_count" value="6">
    <div class="table-responsive">
      <table class="table table-dark table-sm align-middle">
        <thead><tr><th style="width:55%;">Finished Goods</th><th class="text-end">On Hand</th><th class="text-end">Qty Sent</th><th class="text-end">Unit Price</th></tr></thead>
        <tbody>
          {% for i in range(1, 7) %}
          <tr>
            <td>
              <select name="fg_id_{{ i }}" class="form-select bg-black border-secondary">
                <option value="">-- optional line --</option>
                {% for fg in fg_items %}
                <option value="{{ fg.id }}">{{ fg.product_name_snapshot }} {{ "%.0f"|format(fg.bottle_size_ml or 0) }}ml (on hand {{ fg.quantity_on_hand }})</option>
                {% endfor %}
              </select>
            </td>
            <td class="text-end">-</td>
            <td><input type="number" min="0" name="qty_{{ i }}" class="form-control bg-black border-secondary text-end" value="0"></td>
            <td><input type="number" min="0" step="0.01" name="price_{{ i }}" class="form-control bg-black border-secondary text-end" value="0"></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <div class="d-flex justify-content-end"><button class="btn btn-warning">Save Delivery</button></div>
  </div>
</form>
{% endblock %}
