<script src="/static/policy_feedback.js"></script>

<script>

(() => {

  const root = document.getElementById("guidedRoot");

  const sessionId = Number(root.dataset.sessionId);

  const sessionMeta = {

    recipeName: root.dataset.recipeName || "",

    version: root.dataset.version || "",

    targetMl: Number(root.dataset.batchMl) || 0,

    targetNic: Number(root.dataset.targetNic) || 0,

    pgvg: root.dataset.pgvg || "30/70",

  };



  const completionSummary = document.getElementById("completionSummary");

  const focusCard = document.getElementById("focusCard");

  const contextPanel = document.getElementById("contextPanel");

  const guidedPolicyBox = document.getElementById("guidedPolicyBox");

  const roleChip = document.getElementById("roleChip");

  const focusTitle = document.getElementById("focusTitle");

  const focusRole = document.getElementById("focusRole");

  const focusIngredient = document.getElementById("focusIngredient");

  const focusBrand = document.getElementById("focusBrand");

  const focusWhy = document.getElementById("focusWhy");

  const workflowPhase = document.getElementById("workflowPhase");

  const focusG = document.getElementById("focusG");

  const focusMeasured = document.getElementById("focusMeasured");

  const focusMeasuredDisplay = document.getElementById("focusMeasuredDisplay");

  const focusPct = document.getElementById("focusPct");

  const focusPctWrap = document.getElementById("focusPctWrap");

  const goatLine = document.getElementById("goatLine");

  const focusActions = document.getElementById("focusActions");

  const focusStepBadge = document.getElementById("focusStepBadge");

  const nextPreviewText = document.getElementById("nextPreviewText");

  const nextPreviewCard = document.getElementById("nextPreviewCard");

  const scaleHero = document.getElementById("scaleHero");

  const scaleLiveBlock = document.getElementById("scaleLiveBlock");

  const targetScaleLabel = document.getElementById("targetScaleLabel");

  const deltaReadout = document.getElementById("deltaReadout");

  const progLabel = document.getElementById("progLabel");



  let coachCache = {};



  const apiJson = async (url, options = {}) => {

    const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });

    const body = await res.json();

    if (!res.ok) {

      const err = new Error(body.message || "Request failed");

      err.policy = body.policy || {};

      err.session = body.session;

      throw err;

    }

    return body;

  };



  const stepTypeFor = (step) => String((step.payload || {}).step_type || "instruction").toLowerCase();

  const stepTypeClass = (stepType) => `tvw-step-${String(stepType || "instruction").toLowerCase().replaceAll("_", "-")}`;



  const LED_CLASS = {

    "Main Flavour": "is-main",

    "Supporting Flavour": "is-support",

    "Accent": "is-accent",

    "Sweetener": "is-sweetener",

    "Cooling": "is-cooling",

    "Base Liquid": "is-base",

    "Nicotine": "is-nic",

    "Safety": "is-safety",

    "Scale": "is-scale",

    "Recovery": "is-recovery",

    "Pour": "is-main",

    "Checkpoint": "is-base",

    "Setup": "is-scale",

    "Done": "is-main",

  };



  const roleLabelFor = (p, stepType) => {

    const cat = String(p.category || "").toLowerCase();

    if (cat === "nicotine") return "Nicotine";

    if (cat === "pg" || cat === "vg") return "Base Liquid";

    const role = String(p.ingredient_role || "").toLowerCase();

    const map = {

      base_main_note: "Main Flavour",

      support: "Supporting Flavour",

      accent: "Accent",

      micro_accent: "Accent",

      sweetener: "Sweetener",

      coolant: "Cooling",

      additive: "Accent",

    };

    if (map[role]) return map[role];

    if (stepType === "tare") return "Scale";

    if (stepType === "caution") return "Safety";

    if (stepType === "recovery") return "Recovery";

    if (stepType === "transition") return "Checkpoint";

    if (stepType === "completion") return "Done";

    if (stepType === "add_ingredient") return "Pour";

    return "Setup";

  };



  const setRoleLed = (label) => {

    const led = LED_CLASS[label] || "is-scale";

    roleChip.textContent = label;

    roleChip.className = "tvw-ws-led " + led;

  };



  const bottleName = (p, stepType) => {

    const name = p.name || p.ingredient_name || p.title || "";

    if (stepType === "caution") return "Nicotine — gloves on";

    if (stepType === "recovery") return "Fix the pour";

    if (stepType === "transition") return name || "Checkpoint";

    if (stepType === "completion") return "Finished";

    if (stepType === "instruction") return "Prepare your bench";

    return name || "—";

  };



  const ingredientLabel = (p) => {

    const brand = String(p.brand || "").trim();

    const name = String(p.name || p.ingredient_name || "").trim();

    if (brand && name) return `${brand} ${name}`;

    return name || brand || "—";

  };



  const peekLinkedPourStep = (steps, current) => {

    if (!current || !steps) return null;

    const type = stepTypeFor(current);

    if (type === "add_ingredient") return current;

    if (type !== "tare") return null;

    const no = Number(current.step_no);

    return steps.find((s) => Number(s.step_no) === no + 1 && stepTypeFor(s) === "add_ingredient") || null;

  };



  const computeBottleFill = (steps) => {

    const pours = (steps || []).filter((s) => stepTypeFor(s) === "add_ingredient");

    const totalG = pours.reduce((sum, s) => sum + Number((s.payload || {}).target_grams || (s.payload || {}).grams || 0), 0);

    let doneG = 0;

    for (const s of pours) {

      if (!s.completed_at) continue;

      const p = s.payload || {};

      const g = p.measured_grams != null && p.measured_grams !== ""

        ? Number(p.measured_grams)

        : Number(p.target_grams || p.grams || 0);

      if (Number.isFinite(g)) doneG += g;

    }

    const pct = totalG > 0 ? Math.min(100, Math.round((doneG / totalG) * 100)) : 0;

    return { pct, doneG, totalG };

  };



  const benchReminderText = (sess, current, steps) => {

    if (!current) return "";

    const type = stepTypeFor(current);

    const p = current.payload || {};

    const name = ingredientLabel(p);

    const donePourCount = (steps || []).filter((s) => stepTypeFor(s) === "add_ingredient" && s.completed_at).length;

    if (type === "instruction") {

      return "Arrange concentrate bottles on the RIGHT side of your bench in the order you will add them.";

    }

    if (type === "tare" && donePourCount === 0) {

      return "First pour: bottles stay on the RIGHT until each one is used. Zero the scale before you pick up the bottle.";

    }

    if (type === "add_ingredient") {

      return `When this pour is logged, move ${name} to the LEFT side of your bench so you cannot add it twice.`;

    }

    if (type === "transition") {

      return `Move ${name} to the LEFT side of your bench, then continue to the next bottle on the RIGHT.`;

    }

    return donePourCount > 0

      ? "Used bottles live on the LEFT. Upcoming pours stay on the RIGHT."

      : "Keep upcoming bottles on the RIGHT side of your bench in pour order.";

  };



  const journeySectionsFor = (steps, current) => {

    const order = [

      { id: "nic", label: "Nicotine", test: (p) => String(p.category || "").toLowerCase() === "nicotine" },

      { id: "main", label: "Main Flavours", test: (p) => String(p.ingredient_role || "") === "base_main_note" },

      { id: "support", label: "Supporting Flavours", test: (p) => String(p.ingredient_role || "") === "support" },

      { id: "accent", label: "Accents", test: (p) => ["accent", "micro_accent", "additive"].includes(String(p.ingredient_role || "")) },

      { id: "sweet", label: "Sweetener", test: (p) => String(p.ingredient_role || "") === "sweetener" },

      { id: "cool", label: "Cooling", test: (p) => String(p.ingredient_role || "") === "coolant" },

      { id: "pg", label: "PG", test: (p) => String(p.category || "").toLowerCase() === "pg" },

      { id: "vg", label: "VG", test: (p) => String(p.category || "").toLowerCase() === "vg" },

    ];

    const present = new Set();

    for (const s of steps || []) {

      const t = stepTypeFor(s);

      if (t !== "add_ingredient" && t !== "tare") continue;

      const p = s.payload || {};

      for (const sec of order) {

        if (sec.test(p)) present.add(sec.id);

      }

    }

    let activeId = "";

    if (current) {

      const pour = peekLinkedPourStep(steps, current) || (stepTypeFor(current) === "add_ingredient" ? current : null);

      const cp = (pour && pour.payload) || current.payload || {};

      for (const sec of order) {

        if (sec.test(cp)) activeId = sec.id;

      }

    }

    return order.filter((s) => present.has(s.id)).map((s) => ({

      ...s,

      active: s.id === activeId,

      done: !activeId ? false : order.findIndex((x) => x.id === s.id) < order.findIndex((x) => x.id === activeId),

    }));

  };



  const goatSays = (p, stepType, coach) => {

    const generic = ["Steady hands", "Steady control", "Keep your normal approach", "Bench note"];

    const pick = (...lines) => lines.find((l) => l && String(l).trim()) || "";



    if (stepType === "recovery") {

      return pick(p.tip, p.what, coach.detail, "You overshot. Slow down isn\u2019t optional anymore.");

    }

    if (stepType === "caution") {

      return pick(p.tip, p.what, "Nicotine isn\u2019t forgiving. Verify the bottle.");

    }

    if (stepType === "tare") {

      return pick(

        "Always zero your scale before changing bottles. Even a tiny leftover weight can throw the next ingredient off.",

        p.what,

      );

    }

    if (stepType === "add_ingredient") {

      const tip = pick(p.tip, coach.detail);

      if (tip && !generic.some((g) => tip.includes(g)) && !/tare as mandatory/i.test(tip)) return tip;

      const pct = Number(p.percent != null ? p.percent : p.pct);

      if (pct > 0 && pct < 1) return "Tiny pour. The scale matters more than your wrist speed.";

      if (pct >= 5) return "Main layer — get it right, everything else sits on this.";

      return "Creep up on the number. Last 0.1 g is where people wreck it.";

    }

    const detail = (coach || {}).detail || "";

    if (detail && !generic.some((g) => detail.includes(g))) return detail;

    return pick(p.tip, p.what, "");

  };



  const actionLabelFor = (stepType, p) => {

    const map = {

      tare: "Scale Zeroed",

      add_ingredient: "Pour Complete",

      transition: "Next Ingredient",

      caution: "Safety Clear",

      recovery: "Continue",

      instruction: "Ready to Pour",

      completion: "Done",

    };

    if (map[stepType]) return map[stepType];

    const fromServer = String(p.action_label || "").trim();

    if (fromServer && fromServer !== "Mark step done") return fromServer;

    return "Next";

  };



  const undoLabelFor = (stepType) => {

    if (stepType === "add_ingredient") return "Re-weigh";

    if (stepType === "tare") return "Not zeroed yet";

    return "Back";

  };



  const estimateMixMinutes = (totalSteps) => Math.max(1, Math.ceil((totalSteps || 1) * 0.75));

  const esc = (s) => String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  const prepChecklistHtml = (targetNic) => {

    const items = [

      "Flavour concentrates on the RIGHT of your bench, in pour order",

      "Empty vessel centred on scale",

      "PG/VG base within reach",

      "Pipettes, labels, and gloves ready",

    ];

    if (targetNic > 0) {

      items.splice(2, 0, "Nicotine bottle strength verified");

    }

    return items.map((t) => `<li class="tvw-ws-check-item"><span class="tvw-ws-check-box" aria-hidden="true"></span>${t}</li>`).join("");

  };



  const renderContextPanel = (sess, current, stepType) => {

    const prog = sess.progress || {};

    const steps = sess.steps || [];

    const total = prog.total_steps || 0;

    const done = prog.completed_steps || 0;

    const estMin = estimateMixMinutes(total);

    const meta = {

      recipeName: sess.recipe_name || sessionMeta.recipeName,

      version: sess.version_number ? `v${sess.version_number}` : sessionMeta.version,

      targetMl: sess.target_ml != null ? sess.target_ml : sessionMeta.targetMl,

      targetNic: sess.target_nic != null ? sess.target_nic : sessionMeta.targetNic,

      pgvg: sess.target_pgvg || sessionMeta.pgvg,

    };

    const pctDone = total > 0 ? Math.round((done / total) * 100) : 0;

    const fill = computeBottleFill(steps);

    const pour = current ? (peekLinkedPourStep(steps, current) || (stepType === "add_ingredient" ? current : null)) : null;

    const pp = (pour && pour.payload) || (current && current.payload) || {};

    const role = pour || current ? roleLabelFor(pp, pour ? stepTypeFor(pour) : stepType) : "—";

    const bench = benchReminderText(sess, current, steps);

    const journey = journeySectionsFor(steps, current);

    const next = current ? steps.find((x) => Number(x.step_no) === Number(current.step_no) + 1) : null;

    let upcoming = "—";

    if (next) {

      const np = next.payload || {};

      if (stepTypeFor(next) === "tare") {

        const pourNext = steps.find((x) => Number(x.step_no) === Number(next.step_no) + 1);

        const p2 = (pourNext && pourNext.payload) || np;

        upcoming = `${roleLabelFor(p2, "add_ingredient")} · ${ingredientLabel(p2)}`;

      } else {

        upcoming = `${roleLabelFor(np, stepTypeFor(next))} · ${ingredientLabel(np)}`;

      }

    }

    const journeyHtml = journey.length

      ? `<ul class="tvw-ws-journey">${journey.map((j) =>

          `<li class="tvw-ws-journey-item${j.active ? " is-active" : ""}${j.done ? " is-done" : ""}">${esc(j.label)}</li>`,

        ).join("")}</ul>`

      : `<p class="tvw-ws-bench-sub">Journey map appears once pouring starts.</p>`;

    const isPrep = stepType === "instruction";

    contextPanel.className = "tvw-ws-panel tvw-ws-prep is-pour-mode";

    contextPanel.innerHTML = `

      <div class="tvw-ws-pour-meta">

        <span class="tvw-ws-kicker">${isPrep ? "Preparation" : "Bench coach"}</span>

        <h2 class="tvw-ws-prep-title">${esc(meta.recipeName)}</h2>

        <dl class="tvw-ws-spec-grid tvw-ws-spec-compact">

          <div class="tvw-ws-spec"><dt>Bottle</dt><dd>${Number(meta.targetMl).toFixed(0)} ml</dd></div>

          <div class="tvw-ws-spec"><dt>Current fill</dt><dd>${fill.pct}%</dd></div>

          <div class="tvw-ws-spec"><dt>Nic</dt><dd>${Number(meta.targetNic).toFixed(1)} mg/ml</dd></div>

          <div class="tvw-ws-spec"><dt>PG/VG</dt><dd>${esc(meta.pgvg)}</dd></div>

        </dl>

        <div class="tvw-ws-fill-track" aria-hidden="true"><div class="tvw-ws-fill-fill" style="width:${fill.pct}%"></div></div>

        <div class="tvw-ws-progress">

          <div class="tvw-ws-progress-track"><div class="tvw-ws-progress-fill" style="width:${pctDone}%"></div></div>

          <span class="tvw-ws-progress-label">${done} / ${total} steps · ~${estimateMixMinutes(Math.max(0, total - done))} min left</span>

        </div>

      </div>

      <section class="tvw-ws-prep-block">

        <h3 class="tvw-ws-block-label">Today's mix</h3>

        ${journeyHtml}

      </section>

      <section class="tvw-ws-prep-block">

        <h3 class="tvw-ws-block-label">Now</h3>

        <p class="tvw-ws-bench-line">${esc(role)}</p>

        ${!isPrep && pp.name ? `<p class="tvw-ws-bench-line tvw-ws-bench-sub">${esc(ingredientLabel(pp))}</p>` : ""}

      </section>

      <section class="tvw-ws-prep-block">

        <h3 class="tvw-ws-block-label">Bench workflow</h3>

        <p class="tvw-ws-bench-line">${esc(bench)}</p>

      </section>

      <section class="tvw-ws-prep-block">

        <h3 class="tvw-ws-block-label">Up next</h3>

        <p class="tvw-ws-bench-line tvw-ws-bench-sub">${esc(upcoming)}</p>

      </section>

      ${isPrep ? `

      <section class="tvw-ws-prep-block">

        <h3 class="tvw-ws-block-label">Checklist</h3>

        <ul class="tvw-ws-checklist">${prepChecklistHtml(Number(meta.targetNic))}</ul>

      </section>` : ""}

    `;

    if (isPrep) {

      goatLine.textContent = "";

      goatLine.className = "tvw-ws-goat-inline";

    }

  };



  const updateDelta = (val, targetG) => {

    if (!Number.isFinite(val) || !Number.isFinite(targetG) || targetG <= 0) {

      deltaReadout.textContent = "";

      deltaReadout.className = "tvw-ws-delta";

      return;

    }

    const d = val - targetG;

    const sign = d >= 0 ? "+" : "";

    deltaReadout.textContent = `${sign}${d.toFixed(2)} g`;

    deltaReadout.className = "tvw-ws-delta " + (

      Math.abs(d) <= Math.max(0.02, targetG * 0.008) ? "is-ok" : (d > 0 ? "is-over" : "is-under")

    );

  };



  const setFocus = (sess) => {

    const prog = sess.progress || {};

    const steps = sess.steps || [];

    const current = steps.find((x) => !x.completed_at) || null;

    const next = current ? steps.find((x) => Number(x.step_no) === Number(current.step_no) + 1) : null;

    const total = prog.total_steps || 0;

    const done = prog.completed_steps || 0;

    coachCache = sess.coach_summary || {};



    focusCard.classList.remove("d-none");

    if (completionSummary) completionSummary.classList.add("d-none");



    if (!current) {

      focusCard.classList.add("d-none");

      if (contextPanel) contextPanel.classList.add("d-none");

      if (completionSummary) completionSummary.classList.remove("d-none");

      return;

    }



    if (contextPanel) contextPanel.classList.remove("d-none");



    const stepType = stepTypeFor(current);

    const p = current.payload || {};

    const pourStep = peekLinkedPourStep(steps, current);

    const displayP = (pourStep && pourStep.payload) || p;

    const isPrep = stepType === "instruction";

    const isTarePhase = stepType === "tare";

    const isPourPhase = stepType === "add_ingredient";

    const isIngredientFlow = isTarePhase || isPourPhase;

    const role = isIngredientFlow

      ? roleLabelFor(displayP, "add_ingredient")

      : roleLabelFor(p, stepType);



    renderContextPanel(sess, current, stepType);



    setRoleLed(role);

    const stepPad = String(current.step_no).padStart(2, "0");

    const totalPad = String(total).padStart(2, "0");

    focusStepBadge.textContent = `${stepPad} / ${totalPad}`;

    progLabel.textContent = `${done}/${total}`;



    const flowClass = isIngredientFlow ? " is-ingredient-flow" : "";

    const phaseClass = isTarePhase ? " is-tare-phase" : (isPourPhase ? " is-pour-phase" : "");

    focusCard.className = `tvw-ws-panel tvw-ws-face ${stepTypeClass(isIngredientFlow ? "add_ingredient" : stepType)}${flowClass}${phaseClass}`

      + (role === "Nicotine" ? " tvw-role-nicotine-wrap" : "")

      + (isPrep ? " is-prep-face" : "");



    focusTitle.textContent = bottleName(displayP, isIngredientFlow ? "add_ingredient" : stepType);



    if (isPrep) {

      focusRole.textContent = "Bench setup";

      focusIngredient.textContent = "Prepare your bench";

      focusBrand.textContent = "";

      workflowPhase.textContent = String(p.what || "Lay everything out before you touch the scale.").trim();

      focusWhy.textContent = String(p.why || "").trim();

      focusWhy.style.display = focusWhy.textContent ? "" : "none";

    } else if (isIngredientFlow) {

      focusRole.textContent = role;

      focusIngredient.textContent = ingredientLabel(displayP);

      focusBrand.textContent = "";

      workflowPhase.textContent = isTarePhase

        ? "Before pouring · Zero your scale"

        : "Pour to target";

      const whyLine = String(displayP.why || "").trim();

      focusWhy.textContent = whyLine;

      focusWhy.style.display = whyLine ? "" : "none";

    } else {

      focusRole.textContent = role;

      focusIngredient.textContent = bottleName(p, stepType);

      focusBrand.textContent = p.brand || "";

      workflowPhase.textContent = String(p.what || "").trim();

      const whyLine = String(p.why || "").trim();

      focusWhy.textContent = whyLine;

      focusWhy.style.display = whyLine ? "" : "none";

    }



    const targetG = Number(

      displayP.target_grams != null ? displayP.target_grams : (displayP.grams || p.target_grams || p.grams || 0),

    );

    const isWeigh = isPourPhase && targetG > 0;



    if (isPrep) {

      scaleHero.classList.add("is-prep-hidden");

    } else if (isIngredientFlow) {

      scaleHero.classList.remove("is-prep-hidden", "is-solo");

      focusG.textContent = targetG > 0 ? targetG.toFixed(2) : "—";

      targetScaleLabel.textContent = "Target";

      if (isPourPhase) {

        scaleLiveBlock.style.display = "";

        scaleLiveBlock.innerHTML = `

        <span class="tvw-ws-lcd-label">Scale</span>

        <div class="tvw-ws-lcd-value">

          <label for="focusMeasuredInput" class="visually-hidden">Grams on scale</label>

          <input id="focusMeasuredInput" class="tvw-ws-input" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${p.measured_grams != null ? Number(p.measured_grams).toFixed(2) : ""}" aria-label="Grams on scale">

          <span class="tvw-ws-unit">g</span>

        </div>

      `;

        deltaReadout.style.display = "";

      } else {

        scaleLiveBlock.style.display = "";

        scaleLiveBlock.innerHTML = `

        <span class="tvw-ws-lcd-label">Scale</span>

        <div class="tvw-ws-lcd-value tvw-ws-lcd-zero-hint">

          <span class="tvw-ws-zero-mark" aria-hidden="true">✓</span>

          <span class="tvw-ws-readout tvw-ws-readout-hint">0.00</span><span class="tvw-ws-unit">g</span>

        </div>

      `;

        deltaReadout.textContent = "";

        deltaReadout.style.display = "none";

      }

    } else {

      scaleHero.classList.remove("is-prep-hidden");

      scaleHero.classList.add("is-solo");

      focusG.textContent = targetG > 0 ? targetG.toFixed(2) : "—";

      targetScaleLabel.textContent = targetG > 0 ? "Target" : "—";

      scaleLiveBlock.style.display = "none";

      deltaReadout.style.display = "none";

    }



    const pctVal = displayP.percent != null ? displayP.percent : displayP.pct;

    if (pctVal != null && isIngredientFlow) {

      focusPct.textContent = `${Number(pctVal).toFixed(2)}% of mix`;

      focusPctWrap.style.display = "";

    } else {

      focusPctWrap.style.display = "none";

    }



    if (isPrep) {

      const tip = goatSays(p, stepType, coachCache);

      goatLine.textContent = tip || "Arrange concentrate bottles on the RIGHT side of your bench in the order you will add them.";

      goatLine.className = "tvw-ws-goat-inline";

    } else if (!isPrep) {

      const coachP = isIngredientFlow ? displayP : p;

      const line = goatSays(coachP, stepType, coachCache);

      goatLine.textContent = line;

      goatLine.className = "tvw-ws-goat-inline" + (

        stepType === "recovery" || stepType === "caution" ? " is-warn" : ""

      );

    }



    const primaryLabel = actionLabelFor(stepType, p);

    focusActions.innerHTML = `

      <button type="button" class="tvw-ws-commit js-done-step" data-step-no="${current.step_no}">${primaryLabel}</button>

      <button type="button" class="tvw-ws-undo js-undo-step" data-step-no="${current.step_no}">${undoLabelFor(stepType)}</button>

    `;



    const measuredInput = document.getElementById("focusMeasuredInput");

    if (measuredInput) {

      measuredInput.addEventListener("input", () => {

        const raw = measuredInput.value;

        if (raw === "" || raw == null) {

          focusMeasured.textContent = "Measured: --";

          deltaReadout.textContent = "";

          return;

        }

        const val = Number(raw);

        if (!Number.isFinite(val)) return;

        focusMeasured.textContent = `Measured: ${val.toFixed(2)} g`;

        updateDelta(val, targetG);

      });

      measuredInput.focus();

      if (measuredInput.value) measuredInput.dispatchEvent(new Event("input"));

    }



    if (next) {

      let previewRole = "";

      let previewName = "";

      if (stepTypeFor(next) === "tare") {

        const pourNext = steps.find((x) => Number(x.step_no) === Number(next.step_no) + 1);

        const np = (pourNext && pourNext.payload) || next.payload || {};

        previewRole = roleLabelFor(np, "add_ingredient");

        previewName = ingredientLabel(np);

      } else {

        const np = next.payload || {};

        previewRole = roleLabelFor(np, stepTypeFor(next));

        previewName = stepTypeFor(next) === "add_ingredient" ? ingredientLabel(np) : bottleName(np, stepTypeFor(next));

      }

      nextPreviewText.textContent = `${previewRole} · ${previewName}`;

      nextPreviewCard.style.display = "";

    } else {

      nextPreviewCard.style.display = "none";

    }

  };



  const applySession = (sess) => {

    const prog = sess.progress || {};

    if (completionSummary) {

      const showDone = !!prog.all_done;

      completionSummary.classList.toggle("d-none", !showDone);

      if (showDone) {

        focusCard.classList.add("d-none");

        if (contextPanel) contextPanel.classList.add("d-none");

      }

    }

    setFocus(sess);

  };



  const showAlarm = (policy, message) => {

    const cls = window.PolicyFeedback.render(guidedPolicyBox, policy || {}, {

      tone: "tvw",

      warnLead: "Worth a look before you continue.",

      blockLead: "Stop. Fix this first.",

    });

    const hasPolicy = cls.warnings.length || cls.hardStops.length;

    if (!hasPolicy && message) {

      window.PolicyFeedback.notice(guidedPolicyBox, message, { tone: "tvw", severity: "danger" });

      guidedPolicyBox.className = "tvw-ws-alarm is-stop";

      guidedPolicyBox.classList.remove("d-none");

      return;

    }

    if (!hasPolicy) {

      guidedPolicyBox.className = "tvw-ws-alarm d-none";

      return;

    }

    guidedPolicyBox.className = "tvw-ws-alarm" + (cls.blocked ? " is-stop" : "");

    guidedPolicyBox.classList.remove("d-none", "alert", "alert-warning", "alert-danger", "alert-info", "alert-secondary");

  };



  document.getElementById("guidedRoot").addEventListener("click", async (ev) => {

    const doneBtn = ev.target.closest(".js-done-step");

    const undoBtn = ev.target.closest(".js-undo-step");

    if (!doneBtn && !undoBtn) return;

    const stepNo = Number((doneBtn || undoBtn).dataset.stepNo);

    const measuredInput = document.getElementById("focusMeasuredInput");

    const measured = measuredInput ? measuredInput.value : "";

    try {

      const body = await apiJson(`/api/mix/guided/session/${sessionId}/steps/${stepNo}/complete`, {

        method: "POST",

        body: JSON.stringify({ undo: !!undoBtn, measured_grams: measured }),

      });

      applySession(body.session);

      showAlarm(body.policy);

    } catch (e) {

      if (e && e.session) applySession(e.session);

      showAlarm(e.policy, e.message);

    }

  });



  applySession(JSON.parse(document.getElementById("guidedSessionBundle").textContent));

})();

</script>


        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
